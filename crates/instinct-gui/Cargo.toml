[package]
name = "instinct-gui"
description = "GUI spike of the Instinct simulator (egui/eframe adapter)"
edition = "2021"

[[bin]]
name = "instinct-gui"
path = "src/main.rs"

[[test]]
name = "render"
path = "tests/render/mod.rs"

[[test]]
name = "log"
path = "tests/log/mod.rs"

[[test]]
name = "session"
path = "tests/session/mod.rs"

[[test]]
name = "prep"
path = "tests/prep/mod.rs"

[[test]]
name = "time"
path = "tests/time/mod.rs"

[[test]]
name = "reinicio"
path = "tests/reinicio/mod.rs"

[[test]]
name = "determinismo"
path = "tests/determinismo/mod.rs"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
instinct-core = { path = "../instinct-core" }
