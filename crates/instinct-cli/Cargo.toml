[package]
name = "instinct-cli"
description = "CLI of the Instinct simulator"
edition = "2021"

[[bin]]
name = "instinct-cli"
path = "src/main.rs"

[[test]]
name = "cli_run"
path = "tests/cli_run/mod.rs"

[[test]]
name = "cli_annex"
path = "tests/cli_annex/mod.rs"

[[test]]
name = "cli_check"
path = "tests/cli_check/mod.rs"

[[test]]
name = "cli_usage"
path = "tests/cli_usage/mod.rs"

[dependencies]
instinct-core = { path = "../instinct-core" }
